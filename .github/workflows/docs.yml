name: Docs

on:
  push:
    branches: [main, next]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

# Read by default. contents: write is granted only on the deploy job,
# which is the only job that pushes gh-pages.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Quartz CreatedModifiedDate plugin can read git log
          fetch-depth: 0

      # Quartz framework + config + deps + types now live ONLY on the docs
      # branch (kept off main/next so the Obsidian plugin validator scans
      # just the plugin). Fetch the whole Quartz set BEFORE setup-node so its
      # `package-lock.json` cache key resolves. main/next still carries the
      # `docs/` content that we build.
      - name: Checkout Quartz framework + config from docs branch
        run: |
          git fetch origin docs/quartz-framework
          git checkout origin/docs/quartz-framework -- \
            quartz/ quartz.config.ts quartz.layout.ts \
            package.json package-lock.json \
            index.d.ts globals.d.ts tsconfig.quartz.json \
            scripts/check-docs-links.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Quartz dependencies
        run: npm ci

      # ── Lint: wikilinks + anchor refs (runs on PRs and pushes) ───────────
      - name: Check docs wikilinks + anchors
        run: node scripts/check-docs-links.mjs

      # ── Resolve channel + base URL ───────────────────────────────────────
      # One build path for every trigger. The base URL is the only
      # thing that differs between channels:
      #   - stable: push of main, or a pull_request whose base is main
      #   - dev: every other run
      # The branch name is data. Compare the quoted environment
      # variables so it cannot break out of the script text.
      # Custom names on purpose: Actions ignores env assignments that
      # reuse the default GITHUB_* variables.
      - name: Resolve docs channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]] \
             || [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            echo "QUARTZ_BASE_URL=codes.sota-shimozono.com/obsidian-remote-ssh"     >> "$GITHUB_ENV"
            echo "DOCS_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "QUARTZ_BASE_URL=codes.sota-shimozono.com/obsidian-remote-ssh/dev" >> "$GITHUB_ENV"
            echo "DOCS_CHANNEL=dev" >> "$GITHUB_ENV"
          fi

      # ── Build (ALWAYS, including PRs, so a docs break is caught pre-merge
      #    instead of turning main/next red post-merge) ──────────────────
      - name: Build docs (${{ env.DOCS_CHANNEL }})
        # Invoke via node directly. That bypasses bin-shim/exec-bit issues
        # (npx fell back to a non-executable shim on the main-branch run).
        # QUARTZ_BASE_URL comes from the resolve step via $GITHUB_ENV.
        run: node ./quartz/bootstrap-cli.mjs build -d docs

      # Dotfiles such as Quartz's .nojekyll have to travel with the
      # site. upload-artifact drops them unless asked.
      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: public
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: build
    # Push of main or next only. Pull requests build, then stop.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # JamesIves publishes from a worktree of this checkout.
      - uses: actions/checkout@v7

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: public

      # ── Deploy (push to a release branch only, never on PRs) ─────────────
      - name: Deploy - stable to gh-pages root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true
          # Preserve the /dev/ subtree when cleaning the root deployment
          clean-exclude: |
            dev/

      - name: Deploy - dev to gh-pages /dev/
        if: github.event_name == 'push' && github.ref == 'refs/heads/next'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          target-folder: dev
          clean: true
